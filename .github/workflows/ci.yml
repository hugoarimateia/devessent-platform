name: CI — Verificações Seguras Offline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Arquitetura, TypeScript, Lint, Unitários e Build Offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Variáveis explícitas e inofensivas para compilação offline no CI:
      # Nenhuma conexão ao Supabase Cloud, MariaDB, gateway externo ou service_role real.
      APP_BACKEND_MODE: supabase
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-offline-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-offline-public-anon-placeholder-key-not-a-secret-0001
      SUPABASE_SERVICE_ROLE_KEY: ci-offline-server-placeholder-key-not-a-secret-0001
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - name: Configurar Node.js com cache pnpm
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Instalar dependências (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validar arquitetura e isolamento do projeto
        run: pnpm check:project

      - name: Validar tipagem TypeScript
        run: pnpm typecheck

      - name: Validar ESLint / Next.js
        run: pnpm lint

      - name: Executar testes unitários offline
        run: pnpm vitest run tests/unit/

      - name: Executar build de produção offline (sem serviços externos)
        run: pnpm build
