name: Landing CI — Qualidade, Segurança e Build Estático

on:
  push:
    branches:
      - main
      - feature/landing-cloudflare
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing-quality-and-build:
    name: Landing Page (Lint, TypeScript, Testes, Segurança e Export Estático)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/landing
    env:
      NEXT_PUBLIC_SITE_URL: https://devessent-landing.pages.dev
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10

      - name: Configurar Node.js com cache isolado da landing
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/landing/pnpm-lock.yaml

      - name: Instalar dependências da landing (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Auditoria básica de segurança e isolamento
        run: pnpm check:security

      - name: Validar tipagem TypeScript
        run: pnpm typecheck

      - name: Validar ESLint / Next.js
        run: pnpm lint

      - name: Executar testes unitários (formulário e Edge Function)
        run: pnpm test

      - name: Executar build estático de produção (Cloudflare Pages)
        run: pnpm build

      - name: Validar artefatos obrigatórios em out/
        run: pnpm check:export
