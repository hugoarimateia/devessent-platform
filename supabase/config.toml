# DevEssent Platform Core - Supabase Configuration
project_id = "devessent-platform-local"

[api]
enabled = true
port = 54321
schemas = ["public", "auth", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
# Regra Crítica: Seeds automáticos desativados; dados fictícios ficam exclusivamente em sandbox-data/
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/redefinir-senha"
]
jwt_expiry = 3600
enable_signup = false

[analytics]
# Analytics/Logflare desativado para ambiente local
enabled = false

[realtime]
# Realtime desativado: aplicação é SSR/Server Components com zero dependência de websockets
enabled = false

[edge_runtime]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324
