<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redefinição de Senha — DevEssent Platform</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0b0b0b; color: #f5f5f7; padding: 40px 20px;">
  <div style="max-width: 520px; margin: 0 auto; background-color: #141416; border: 1px solid #27272a; border-radius: 12px; padding: 32px;">
    <h2 style="margin-top: 0; color: #ffffff; font-size: 20px;">Recuperação de Acesso</h2>
    <p style="color: #a1a1aa; font-size: 14px; line-height: 1.6;">
      Recebemos uma solicitação para redefinir a senha associada à sua conta corporativa na <strong>DevEssent Platform</strong>.
    </p>
    <div style="margin: 28px 0; text-align: center;">
      <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
         style="display: inline-block; background-color: #a782ff; color: #0b0b0b; font-weight: 600; font-size: 14px; text-decoration: none; padding: 12px 24px; border-radius: 8px;">
        Redefinir Minha Senha
      </a>
    </div>
    <p style="color: #71717a; font-size: 12px; line-height: 1.5; margin-top: 24px; border-top: 1px solid #27272a; pt: 16px;">
      Caso não tenha solicitado a alteração, ignore este e-mail. O link expira em conformidade com as diretrizes de segurança da plataforma.
    </p>
  </div>
</body>
</html>
